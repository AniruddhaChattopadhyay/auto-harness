[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-optimization-service"
version = "0.1.0"
description = "Backend service that runs an inner agent against TerminalBench tasks and iteratively optimizes it via an outer LLM agent."
requires-python = ">=3.12"
dependencies = [
    # Web + ASGI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",

    # Persistence
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.4",

    # Object storage (MinIO is S3-compatible)
    "minio>=7.2",

    # Outer agent (v1) — Claude Agent SDK
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40",

    # Inner agent + benchmark execution
    "litellm>=1.50",
    "harbor[e2b]>=0.5.0",
    "openai>=1.50",

    # Logging
    "structlog>=24",

    # Misc
    "python-ulid>=2.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["api*", "worker*", "core*", "seed*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
